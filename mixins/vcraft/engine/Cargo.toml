[package]
name = "vcraft-engine"
version = "2.4.0"
edition = "2024"
license = "MIT"
description = "VCraft for Horizon: voice calls, group chats and direct messages with friends, end-to-end encrypted"
publish = false

# Only crates in Horizon's Cargo.lock, by version requirement.
[dependencies]
serde_json = "1"
ring = "0.17"
curve25519-dalek = { version = "4", default-features = false }
base64 = "0.22"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tungstenite = { version = "0.30", default-features = false }
cpal = "0.16"
ureq = { version = "2", default-features = false, features = ["tls"] }
png = "0.18"
regex = "1"
chrono = "0.4"
open = "5"
arboard = { version = "3", default-features = false }
